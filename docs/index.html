<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Straighten Up! — Legal</title>
<style>
  :root {
    --cream: #FBF4EA;
    --ink: #211A12;
    --coral: #FF5A3C;
    --amber: #FFB020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--coral);
    font-weight: 700;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }
  p {
    color: #6A5E4E;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .links { display: grid; gap: 12px; }
  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--cream);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
  }
  .links a:hover { background: var(--amber); }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #9A8E7C;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">STRAIGHTEN UP!</div>
    <h1>Legal &<br>Privacy</h1>
    <p>Below you'll find our privacy policy and legal information for Straighten Up!, a mobile posture reminder app by Tenity Studio.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy →</a>
      <a href="impressum.html">Impressum →</a>
    </div>
    <div class="footer">Tenity Studio · info@tenitystudio.com</div>
  </div>
</body>
</html>
